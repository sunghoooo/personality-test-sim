<meta charset="utf-8">
<title>HMAT 인성검사 연습</title>
<meta name="description" content="HMAT 인성검사의 응답 형식을 재현하고, 응답의 일관성 패턴을 확인하는 연습 도구">
<style>
:root{
  --paper:#E9ECE6; --card:#FFFFFF; --ink:#16181A; --ink2:#5D6459; --ink3:#8C9388;
  --rule:#C3C9BE; --mark:#23407A; --mark-soft:#DCE3F0; --stamp:#A8321E;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:20px 24px 84px;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.top .t{font-size:19px;font-weight:800;letter-spacing:-.01em}
.top .m{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.instr{background:var(--card);border:1px solid var(--rule);padding:11px 15px;margin-bottom:14px;font-size:13.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:14px}
.instr b{color:var(--ink)}
.grid{background:var(--card);border:1px solid var(--rule)}
.ghead{display:grid;grid-template-columns:1fr 328px 132px;border-bottom:1.5px solid var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.ghead>div{padding:7px 12px;text-align:center}
.ghead>div:first-child{text-align:left}
.ghead .sub{display:flex;justify-content:space-between;font-size:10px;margin-top:2px}
.set{border-bottom:8px solid var(--paper)}
.set:last-child{border-bottom:none}
.row{display:grid;grid-template-columns:1fr 328px 132px;align-items:center;border-bottom:1px solid #EDF0EA}
.set .row:last-child{border-bottom:none}
.row .q{padding:9px 12px;font-size:14.5px;line-height:1.35}
.row .a1,.row .a2{display:flex;gap:6px;justify-content:center;padding:6px 10px;border-left:1px solid #EDF0EA}
.bx{width:32px;height:30px;border:1.4px solid var(--rule);background:#fff;font-family:var(--mono);font-size:12px;color:var(--ink3);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.bx:hover{border-color:var(--mark)}
.bx[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#fff;font-weight:700}
.ml{width:56px;height:30px;border:1.4px solid var(--rule);background:#fff;font-size:12.5px;color:var(--ink3);cursor:pointer;padding:0}
.ml:hover{border-color:var(--mark)}
.ml[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#fff;font-weight:700}
.ml.far[aria-pressed="true"]{background:var(--stamp);border-color:var(--stamp)}
.setno{font-family:var(--mono);font-size:10px;color:var(--ink3);padding:5px 12px 0;letter-spacing:.1em}
.q2{background:var(--card);border:1px solid var(--rule);margin-bottom:8px;display:grid;grid-template-columns:1fr 480px;align-items:center}
.q2 .q{padding:13px 15px;font-size:15px}
.q2 .a{display:flex;gap:7px;padding:9px 12px;border-left:1px solid #EDF0EA}
.op{flex:1;height:38px;border:1.4px solid var(--rule);background:#fff;font-size:13px;color:var(--ink2);cursor:pointer;padding:0}
.op:hover{border-color:var(--mark)}
.op[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#fff;font-weight:700}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding:9px 0 11px;z-index:40}
.foot .in{max-width:960px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:14px}
.gauge{flex:1;height:9px;background:#D5DBD0;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--mark);width:100%;transition:width .95s linear}
.gauge.low i{background:var(--stamp)}
.foot .lab{font-family:var(--mono);font-size:11.5px;color:var(--ink2);white-space:nowrap}
.foot .warn{color:var(--stamp);opacity:0;transition:opacity .2s}
.nextbtn{background:var(--ink);color:var(--paper);border:none;padding:9px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.nextbtn:hover{background:var(--mark)}
.card{background:var(--card);border:1px solid var(--rule);padding:22px 24px;margin-bottom:14px}
.card.notice{border-left:5px solid var(--stamp)}
.card.notice h3{color:var(--stamp);font-size:14px;letter-spacing:.1em}
.card.notice p{color:var(--ink);font-size:13.5px;line-height:1.7;margin-bottom:9px}
.card.notice .key{color:var(--stamp);font-weight:800;font-size:15.5px;line-height:1.55;margin:12px 0}
.rline{border-left:4px solid var(--stamp);background:#FBF2F0;padding:10px 14px;margin-bottom:14px;
  font-size:13.5px;color:var(--stamp);font-weight:700}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:12px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 0 11px;font-weight:600}
p{margin:0 0 10px}
.lead{color:var(--ink2);font-size:14.5px}
.fine{font-size:12.5px;color:var(--ink3);line-height:1.65}
ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14px}
li{margin-bottom:4px}
.btn{background:var(--ink);color:var(--paper);border:none;padding:13px 30px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--mark)}
.chip{border:1px solid var(--rule);background:#fff;padding:9px 16px;font-size:14px;color:var(--ink2);cursor:pointer;font-family:inherit;margin-right:8px}
.chip[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#fff;font-weight:600}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:11px}
.su{border:1px solid var(--rule);padding:13px}
.su .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--ink3)}
.su .v{font-size:24px;font-weight:800;margin:2px 0;font-variant-numeric:tabular-nums}
.su .d{font-size:12px;color:var(--ink2);line-height:1.45}
.bar-row{display:grid;grid-template-columns:118px 1fr 40px;gap:11px;align-items:center;margin-bottom:7px;font-size:13.5px}
.bar{height:14px;background:var(--mark-soft);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--mark)}
.bar-val{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--ink2)}
.item{border-left:3px solid var(--rule);padding:9px 0 9px 13px;margin-bottom:12px;font-size:14px}
.item.hard{border-left-color:var(--stamp)}
.item .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:3px}
.ans{font-family:var(--mono);font-size:12px;color:var(--mark)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--rule)}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;color:var(--ink3);font-weight:600}
td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.hist{display:flex;align-items:flex-end;gap:6px;height:76px;margin-top:18px}
.hist div{flex:1;background:var(--mark);position:relative;min-height:2px}
.hist div u{position:absolute;top:-15px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink2);text-decoration:none}
.hist-x{display:flex;gap:6px;margin-top:4px}
.hist-x span{flex:1;text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink3)}
@media print{.foot{display:none}}
</style>

<div class="wrap"><div id="app"></div></div>
<div class="foot" id="foot" hidden>
  <div class="in">
    <span class="lab" id="flab"></span>
    <div class="gauge" id="gauge"><i id="gfill"></i></div>
    <span class="lab" id="fcnt"></span>
    <span class="lab warn" id="warn"></span>
    <button class="nextbtn" id="fnext">다음</button>
  </div>
</div>

const sh=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];}return b;};

/* 클러스터에서 유형·방향을 섞어 k개 추출 */
function pick(list,k){
  const byT={D:[],B:[],C:[]};
  list.forEach(x=>byT[x[3]].push(x));
  Object.keys(byT).forEach(t=>{
    const p=sh(byT[t].filter(x=>x[2]===1)), n=sh(byT[t].filter(x=>x[2]===-1)), o=[];
    while(p.length||n.length){ if(p.length)o.push(p.shift()); if(n.length)o.push(n.shift()); }
    byT[t]=o;
  });
  const order=sh(['D','B','C']), out=[];
  while(out.length<k){
    let added=false;
    for(const t of order){
      if(out.length>=k) break;
      if(byT[t].length){ out.push(byT[t].shift()); added=true; }
    }
    if(!added) break;
  }
  return out;
}

/* 클러스터 간격을 둔 배치 */
function spread(list, per, maxSame){
  const rem=list.slice(), pages=[]; let prev=new Set();
  while(rem.length){
    const page=[], cur={};
    for(let pass=0;pass<3&&page.length<per;pass++){
      for(let i=0;i<rem.length&&page.length<per;i++){
        const c=rem[i][1], n=cur[c]||0;
        if(pass===0&&(n>=maxSame||prev.has(c))) continue;
        if(pass===1&&n>=maxSame) continue;
        page.push(rem.splice(i,1)[0]); cur[c]=n+1; i--;
      }
    }
    pages.push(page); prev=new Set(page.map(x=>x[1]));
  }
  return pages;
}

/* 축이 서로 다른 3문항 세트 */
function makeSets(pool,count){
  const p=sh(pool), out=[];
  while(out.length<count&&p.length>=3){
    const used=new Set(), s=[];
    for(let i=0;i<p.length&&s.length<3;i++){
      if(!used.has(ax(p[i][1]))){used.add(ax(p[i][1]));s.push(p.splice(i,1)[0]);i--;}
    }
    if(s.length<3) break;
    out.push(s);
  }
  return out;
}
function spreadSets(sets,per,maxSame){
  const rem=sets.slice(), pages=[]; let prev=new Set();
  while(rem.length){
    const page=[], cur={};
    for(let pass=0;pass<3&&page.length<per;pass++){
      for(let i=0;i<rem.length&&page.length<per;i++){
        const cs=rem[i].map(x=>x[1]);
        const bad0=cs.some(c=>(cur[c]||0)>=maxSame||prev.has(c));
        const bad1=cs.some(c=>(cur[c]||0)>=maxSame);
        if(pass===0&&bad0) continue;
        if(pass===1&&bad1) continue;
        const s=rem.splice(i,1)[0]; page.push(s);
        s.forEach(x=>cur[x[1]]=(cur[x[1]]||0)+1); i--;
      }
    }
    pages.push(page); prev=new Set(page.flat().map(x=>x[1]));
  }
  return pages;
}

    </ul>
  </div>
  <div class="card">

  </div>

    <p class="key">반드시 참고용으로만 사용하세요. 결과는 성격 진단이나 합격 예측이 아닙니다.</p>
    <p>결과는 실제 검사 결과와 아무런 관련이 없습니다. 여기서 응답이 많이 갈렸더라도 실제 검사에서는 그렇지 않을 수 있고, 그 반대도 마찬가지입니다.</p>
    <p>모든 문항은 자체 제작한 원본이며 실제 시험 문항이 아닙니다. 문항 분류는 성격 6요인 모델(HEXACO, Ashton &amp; Lee)의 구조를 참고했으나 공식 HEXACO-PI-R 검사와 무관하고, 문항의 신뢰도와 타당도를 통계적으로 검증하지 않았습니다.</p>

  </div>
  <button class="btn" id="go">검사 시작</button>`;
  let mode='full';
  const desc=()=>{
    const M=MODE[mode], p1=M.sets*3+M.tail;

      + (mode==='quarter'?`<br><span class="fine">문항 수가 적어 영역별 응답이 3개씩만 뽑힙니다. 응답 패턴이 충분히 드러나지 않을 수 있습니다.</span>`:'');
  };

/* 구성 */
function start(mode){
  const M=MODE[mode];
  const sd=sh(Q.filter(x=>x[1]==='SD')).slice(0,M.sd);
  const at=sh(Q.filter(x=>x[1]==='AT')).slice(0,M.at);

  // 클러스터별로 같은 개수씩 뽑는다
  const byCl={};
  Q.filter(x=>x[1]!=='SD'&&x[1]!=='AT').forEach(x=>{(byCl[x[1]]=byCl[x[1]]||[]).push(x);});
  let pool=[];
  Object.values(byCl).forEach(list=>{pool=pool.concat(pick(list,M.k));});
  pool=sh(pool);

  const sets=makeSets(pool,M.sets);
  const used=new Set(sets.flat().map(x=>x[0]));

  const left=pool.filter(x=>!used.has(x[0]));
  const tail=[], tAx=new Set();
  for(let i=0;i<left.length&&tail.length<M.tail;i++){
    if(!tAx.has(ax(left[i][1]))){tAx.add(ax(left[i][1]));tail.push(left[i]);used.add(left[i][0]);}
  }

  const rest=pool.filter(x=>!used.has(x[0]));
  const p2=sh(rest.slice(0,M.p2-sd.length-at.length).concat(sd,at));

  const pages=[];
  spreadSets(sets,3,2).forEach(p=>pages.push({t:1,sets:p,limit:T1}));
  if(tail.length) pages.push({t:1,sets:[tail],limit:T1});
  pages.push({t:0});
  spread(p2,5,1).forEach(p=>pages.push({t:2,items:p,limit:T2}));

  S={mode,pages,i:0,ans:{},t0:Date.now()};
  foot.hidden=false;
  render();
}

function complete(){
  const p=S.pages[S.i], a=S.ans[S.i];
  if(p.t===0) return true;
  if(!a) return false;
  if(p.t===1) return a.every(s=>s.v.every(v=>v!==null)&&s.near!==null&&s.far!==null);
  return a.every(v=>v!==null);
}
function startTimer(){
  clearInterval(tick);
  const p=S.pages[S.i], g=document.getElementById('gauge'), f=document.getElementById('gfill');
  if(p.t===0){g.style.visibility='hidden';return;}
  g.style.visibility='visible'; S.left=p.limit;
  f.style.transition='none'; f.style.width='100%'; void f.offsetWidth;
  f.style.transition='width .95s linear'; g.classList.remove('low');
  tick=setInterval(()=>{
    S.left--; f.style.width=Math.max(0,S.left/p.limit*100)+'%';
    if(S.left<=p.limit*0.25) g.classList.add('low');
    if(S.left<=0){clearInterval(tick);go(true);}
  },1000);
}
function go(auto){
  if(!auto&&!complete()){
    const w=document.getElementById('warn');
    w.textContent='응답하지 않은 항목이 있습니다'; w.style.opacity='1';
    clearTimeout(S.wt); S.wt=setTimeout(()=>w.style.opacity='0',2200);
    return;
  }
  clearInterval(tick);
  if(S.i>=S.pages.length-1) return report();
  S.i++; render();
}

/* 렌더 */

    <div class="grid">
      <div class="ghead">
        <div>문항</div>
        <div>응답 1<div class="sub"><span>매우 아니다</span><span>매우 그렇다</span></div></div>
        <div>응답 2<div class="sub"><span>가깝다</span><span>멀다</span></div></div>
      </div>
      ${p.sets.map((set,si)=>`<div class="set"><div class="setno">SET ${si+1}</div>
        ${set.map((q,qi)=>`<div class="row">
          <div class="q">${q[0]}</div>
          <div class="a1" data-s="${si}" data-q="${qi}">
            ${[1,2,3,4,5,6,7].map(v=>`<button class="bx" data-v="${v}" aria-pressed="${a[si].v[qi]===v}">${v}</button>`).join('')}
          </div>
          <div class="a2">
            <button class="ml" data-s="${si}" data-k="near" data-q="${qi}" aria-pressed="${a[si].near===qi}">가깝다</button>
            <button class="ml far" data-s="${si}" data-k="far" data-q="${qi}" aria-pressed="${a[si].far===qi}">멀다</button>
          </div></div>`).join('')}</div>`).join('')}
    </div>`;
  } else {
    const base=S.pages.slice(0,S.i).filter(x=>x.t===2).reduce((s,x)=>s+x.items.length,0);
    app.innerHTML=`
    <div class="top"><div class="t">인성검사 II</div><div class="m">${S.i-n1} / ${n2} 페이지</div></div>
    <div class="instr"><span>각 문장이 자신과 가까운 정도를 하나씩 고르세요.</span><b style="white-space:nowrap">20초</b></div>
    ${p.items.map((q,qi)=>`<div class="q2">
      <div class="q">${q[0]}</div>
      <div class="a" data-q="${qi}">
        ${L4.map((l,li)=>`<button class="op" data-v="${li+1}" aria-pressed="${a[qi]===li+1}">${l}</button>`).join('')}

      if(a[si][k]===qi)a[si][k]=null;
      else{a[si][k]=qi; if(k==='near'&&a[si].far===qi)a[si].far=null; if(k==='far'&&a[si].near===qi)a[si].near=null;}
      app.querySelectorAll(`.ml[data-s="${si}"]`).forEach(x=>x.setAttribute('aria-pressed',String(a[si][x.dataset.k]===+x.dataset.q)));return;}

    if(o){const box=o.closest('.a'),qi=+box.dataset.q;
      a[qi]=+o.dataset.v;

}
document.getElementById('fnext').onclick=()=>go(false);

/* 채점 */
function report(){
  clearInterval(tick); foot.hidden=true;
  const R=[];                    // 응답 레코드
  const dist=[0,0,0,0,0,0,0];
  let tot=0, miss=0, ipsHit=0, ipsTot=0;

  S.pages.forEach((p,pi)=>{
    if(p.t===0) return;
    const a=S.ans[pi];
    if(p.t===1){
      p.sets.forEach((set,si)=>{
        set.forEach((q,qi)=>{
          tot++;
          const v=a?a[si].v[qi]:null;
          if(v==null){miss++;return;}
          dist[v-1]++;
          const raw=(v-1)/6*100;
          R.push({q,cl:q[1],dir:q[2],type:q[3],part:1,v,step:q[2]===1?v:8-v,n:q[2]===1?raw:100-raw});
        });
        // 강제선택 일치 확인
        if(a&&a[si].near!=null&&a[si].far!=null){
          const vs=a[si].v;
          if(vs.every(x=>x!==null)){
            ipsTot++;
            const hi=Math.max(...vs), lo=Math.min(...vs);
            if(vs[a[si].near]===hi&&vs[a[si].far]===lo) ipsHit++;
          }
        }
      });
    } else {
      p.items.forEach((q,qi)=>{
        tot++;
        const v=a?a[qi]:null;
        if(v==null){miss++;return;}
        const raw=V4[v-1];
        R.push({q,cl:q[1],dir:q[2],type:q[3],part:2,v,step:q[2]===1?v:5-v,n:q[2]===1?raw:100-raw});
      });
    }
  });

  const ansN=R.length;
  const norm=R.filter(r=>r.cl!=='SD'&&r.cl!=='AT');
  const sdR=R.filter(r=>r.cl==='SD');
  const atR=R.filter(r=>r.cl==='AT');

  // 클러스터별 집계
  const byCl={};
  norm.forEach(r=>{(byCl[r.cl]=byCl[r.cl]||[]).push(r);});

  // 모순 쌍
  const pairs=[];
  Object.entries(byCl).forEach(([cl,rs])=>{
    for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++){
      if(rs[i].part!==rs[j].part) continue;
      const d=Math.abs(rs[i].step-rs[j].step);
      const hard=rs[i].part===1?4:3, mild=rs[i].part===1?3:2;
      if(d>=mild) pairs.push({cl,a:rs[i],b:rs[j],d,level:d>=hard?'명확':'경미'});
    }
  });
  pairs.sort((x,y)=>y.d-x.d);
  const hardN=pairs.filter(x=>x.level==='명확').length;
  const mildN=pairs.filter(x=>x.level==='경미').length;

  // 응답 안정도 (클러스터 표준편차 평균)
  const sds=[];
  Object.values(byCl).forEach(rs=>{
    if(rs.length<4) return;
    const m=rs.reduce((s,r)=>s+r.n,0)/rs.length;
    sds.push(Math.sqrt(rs.reduce((s,r)=>s+(r.n-m)**2,0)/(rs.length-1)));
  });
  const stab=sds.length?Math.max(0,Math.round(100-(sds.reduce((a,b)=>a+b,0)/sds.length)*2.2)):null;

  // 조건부 격차 (축 단위 — 클러스터 단위는 문항이 적어 잡음이 큼)
  const byAxAll={};
  norm.forEach(r=>{const k=ax(r.cl);(byAxAll[k]=byAxAll[k]||[]).push(r);});
  const gapList=[];
  Object.entries(byAxAll).forEach(([k,rs])=>{
    const d=rs.filter(r=>r.type!=='C'), c=rs.filter(r=>r.type==='C');
    if(d.length<5||c.length<5) return;
    const md=d.reduce((s,r)=>s+r.n,0)/d.length, mc=c.reduce((s,r)=>s+r.n,0)/c.length;
    gapList.push({k,name:AXIS[k],gap:Math.round(md-mc),md:Math.round(md),mc:Math.round(mc),nd:d.length,nc:c.length});
  });
  gapList.sort((a,b)=>b.gap-a.gap);

  // 축별
  const byAx={};
  norm.forEach(r=>{const k=ax(r.cl);(byAx[k]=byAx[k]||[]).push(r.n);});
  const prof=Object.keys(AXIS).map(k=>({k,name:AXIS[k],
    v:byAx[k]?Math.round(byAx[k].reduce((a,b)=>a+b,0)/byAx[k].length):null,n:byAx[k]?byAx[k].length:0}));

  // 흔들린 영역
  const clCount={};
  pairs.forEach(p=>clCount[p.cl]=(clCount[p.cl]||0)+1);
  const shaky=Object.entries(clCount).sort((a,b)=>b[1]-a[1]).slice(0,3);

  const sdScore=sdR.length?Math.round(sdR.reduce((s,r)=>s+r.n,0)/sdR.length):null;
  const atFail=atR.filter(r=>r.v>=(r.part===1?5:3)).length;
  const d7=dist.reduce((a,b)=>a+b,0);
  const mid=d7?Math.round(dist[3]/d7*100):null;
  const ext=d7?Math.round((dist[0]+dist[6])/d7*100):null;
  const elapsed=Math.round((Date.now()-S.t0)/1000);
  const mm=s=>Math.floor(s/60)+'분 '+(s%60)+'초';

  // 조언
  const tips=[];
  if(mid!==null&&mid>35) tips.push(`검사 I에서 중앙값 4를 ${mid}% 골랐습니다. 중앙에 몰리면 문항 간 차이가 줄어 같은 개념을 물었을 때의 응답 폭이 좁아집니다.`);
  if(ext!==null&&ext<10) tips.push(`양 끝(1·7) 응답이 ${ext}%입니다. 확실한 문항에서도 중간값을 쓰면 응답의 방향이 흐려집니다.`);
  if(miss>0) tips.push(`${miss}문항이 미응답으로 남았습니다. 페이지당 제한 시간 안에 다 채우지 못한 구간이 있습니다.`);
  if(sdScore!==null&&sdScore>=62) tips.push(`"한 번도 없다" 류 문항에 동의한 정도가 ${sdScore}입니다. 이런 문항이 많이 섞여 있고, 여기에 높게 답할수록 나머지 응답도 후하게 매겼을 가능성이 커집니다.`);
  if(atFail>0) tips.push(`사실상 성립하기 어려운 내용의 문항 ${atFail}개에 긍정으로 답했습니다. 문항을 끝까지 읽지 않고 넘어간 구간이 있는지 확인해 보세요.`);
  if(stab!==null&&stab>=85&&sdScore!==null&&sdScore>=70) tips.push(`응답이 매우 일관되게 모여 있으면서 동시에 과장 응답 지표가 높습니다. 문항마다 바람직해 보이는 쪽을 고르면 일관성 자체는 높게 나오지만, 그 일관성은 실제 성향이 아니라 응답 방식에서 나온 것일 수 있습니다.`);
  if(gapList.length&&gapList[0].gap>=30) tips.push(`직접 묻는 문항과 조건이 붙은 문항의 응답 차이가 가장 큰 영역은 ${gapList[0].name}(${gapList[0].gap}점)입니다.`);
  shaky.forEach(([cl,n])=>tips.push(`${CL[cl]} 영역에서 응답이 갈린 문항 조합이 ${n}건입니다.`));

  app.innerHTML=`
  <div class="top"><div class="t">응답 리포트</div><div class="m">${MODE[S.mode].label}</div></div>

  <div class="rline">이 결과는 실제 검사 결과를 예측하지 않습니다. 응답 패턴을 확인하는 참고 자료로만 사용하세요.</div>

  <div class="card">
    <h3>이번 응답 요약</h3>
    <p class="lead" style="margin-bottom:14px">
      ${tot}문항 중 ${ansN}문항 응답 · 소요 ${mm(elapsed)}<br>
      같은 개념을 다르게 물은 문항 조합에서 <b>명확한 차이 ${hardN}건, 경미한 차이 ${mildN}건</b>이 나왔습니다.
    </p>
    <div class="sum">
      <div class="su"><div class="k">응답 안정도</div><div class="v">${stab??'—'}</div>
        <div class="d">같은 개념 문항끼리 응답이 얼마나 모여 있는지</div></div>
      <div class="su"><div class="k">명확한 차이</div><div class="v">${hardN}</div>
        <div class="d">검사 I 4단계 이상, 검사 II 3단계 차이</div></div>
      <div class="su"><div class="k">경미한 차이</div><div class="v">${mildN}</div>
        <div class="d">검사 I 3단계, 검사 II 2단계 차이</div></div>
      <div class="su"><div class="k">미응답</div><div class="v">${miss}</div>
        <div class="d">전체 ${tot}문항 중</div></div>
      ${sdScore!==null?`<div class="su"><div class="k">과장 응답</div><div class="v">${sdScore}</div>
        <div class="d">"한 번도 없다" 류 ${sdR.length}문항 평균</div></div>`:''}
      ${atR.length?`<div class="su"><div class="k">주의력 문항</div><div class="v">${atR.length-atFail}/${atR.length}</div>
        <div class="d">성립하기 어려운 내용에 부정으로 답한 수</div></div>`:''}
      ${mid!==null?`<div class="su"><div class="k">중앙값 비율</div><div class="v">${mid}%</div>
        <div class="d">검사 I에서 4를 고른 비율</div></div>`:''}
      ${ipsTot?`<div class="su"><div class="k">강제선택 일치</div><div class="v">${Math.round(ipsHit/ipsTot*100)}%</div>
        <div class="d">척도 응답과 가깝다·멀다 선택이 맞은 세트</div></div>`:''}
    </div>
  </div>

  ${pairs.length?`<div class="card">
    <h3>응답이 갈린 문항</h3>
    ${pairs.slice(0,12).map(p=>`
      <div class="item ${p.level==='명확'?'hard':''}">
        <div>“${p.a.q[0]}” <span class="ans">${p.a.part===1?p.a.v+' / 7':L4[p.a.v-1]}</span></div>
        <div>“${p.b.q[0]}” <span class="ans">${p.b.part===1?p.b.v+' / 7':L4[p.b.v-1]}</span></div>
        <div class="meta">${CL[p.cl]} · ${p.d}단계 차이 · ${p.level}</div>
      </div>`).join('')}
    ${pairs.length>12?`<p class="fine">이 외 ${pairs.length-12}건은 생략했습니다.</p>`:''}
  </div>`:`<div class="card"><h3>응답이 갈린 문항</h3>
    <p class="lead" style="margin:0">기준을 넘는 차이가 발견되지 않았습니다.</p></div>`}

  ${gapList.length?`<div class="card">
    <h3>조건이 붙었을 때의 차이</h3>
    <p class="fine" style="margin-bottom:8px">같은 영역에서 직접 묻는 문항과 "아무도 모른다면", "다들 그렇게 한다면" 같은 조건이 붙은 문항의 응답 평균 차이입니다. 문항 수가 많지 않아 20점 안팎의 차이는 흔하게 나타납니다.</p>
    <table><thead><tr><th>영역</th><th style="text-align:right">직접</th><th style="text-align:right">조건</th><th style="text-align:right">차이</th></tr></thead>
    <tbody>${gapList.map(g=>`<tr><td>${g.name}</td><td class="n">${g.md}</td><td class="n">${g.mc}</td><td class="n">${g.gap>0?'+':''}${g.gap}</td></tr>`).join('')}</tbody></table>
  </div>`:''}

  ${tips.length?`<div class="card">
    <h3>이번 응답에서 관찰된 것</h3>
    <ul>${tips.map(t=>`<li>${t}</li>`).join('')}</ul>
  </div>`:''}

  <div class="card">
    <h3>영역별 응답 경향 (참고용)</h3>
    ${prof.map(p=>`<div class="bar-row"><span>${p.name}</span>
      <div class="bar"><i style="width:${p.v??0}%"></i></div>
      <span class="bar-val">${p.v??'—'}</span></div>`).join('')}
    <p class="fine" style="margin-top:12px">이 값은 응답이 갈린 위치를 찾기 위한 중간 계산이며, 검증된 성격 점수가 아닙니다. 높고 낮음에 의미를 두지 마세요.</p>
  </div>

  ${d7?`<div class="card"><h3>검사 I 응답 분포</h3>
    <div class="hist">${dist.map(v=>{const m=Math.max(...dist)||1;return `<div style="height:${Math.max(3,v/m*100)}%"><u>${v}</u></div>`}).join('')}</div>
    <div class="hist-x">${[1,2,3,4,5,6,7].map(n=>`<span>${n}</span>`).join('')}</div>
  </div>`:''}

  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn" id="again">다시 응시</button>
    <button class="chip" id="pr" style="padding:13px 24px">리포트 인쇄 / PDF 저장</button>
  </div>`;

  document.getElementById('again').onclick=intro;
  document.getElementById('pr').onclick=()=>window.print();
}

intro();
</script>
